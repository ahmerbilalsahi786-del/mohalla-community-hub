openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: feed
    description: Community feed operations
  - name: safety
    description: Community safety alerts
  - name: marketplace
    description: Buy & sell marketplace listings
  - name: events
    description: Community events and RSVPs
  - name: polls
    description: Community polls and voting
  - name: admin
    description: Admin panel operations
  - name: Storage
    description: Object storage upload and serving endpoints.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /feed:
    get:
      operationId: listPosts
      tags: [feed]
      summary: List community posts
      parameters:
        - name: communityId
          in: query
          required: false
          schema:
            type: string
            default: "default"
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostList"
    post:
      operationId: createPost
      tags: [feed]
      summary: Create a community post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostInput"
      responses:
        "201":
          description: Created post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"

  /feed/{postId}/like:
    post:
      operationId: toggleLike
      tags: [feed]
      summary: Toggle like on a post
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"

  /feed/{postId}/comments:
    get:
      operationId: listComments
      tags: [feed]
      summary: Get comments for a post
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
    post:
      operationId: createComment
      tags: [feed]
      summary: Add a comment to a post
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentInput"
      responses:
        "201":
          description: Created comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"

  /admin/members:
    get:
      operationId: adminListMembers
      tags: [admin]
      summary: List community members
      parameters:
        - name: communityId
          in: query
          required: false
          schema:
            type: string
            default: "default"
        - name: status
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
    post:
      operationId: adminCreateMember
      tags: [admin]
      summary: Submit a join request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberInput"
      responses:
        "201":
          description: Created member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"

  /admin/members/{memberId}/approve:
    patch:
      operationId: adminApproveMember
      tags: [admin]
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"

  /admin/members/{memberId}/reject:
    patch:
      operationId: adminRejectMember
      tags: [admin]
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"

  /admin/members/{memberId}/verify:
    patch:
      operationId: adminVerifyMember
      tags: [admin]
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"

  /admin/members/{memberId}/role:
    patch:
      operationId: adminSetMemberRole
      tags: [admin]
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberRoleUpdate"
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"

  /admin/members/{memberId}:
    delete:
      operationId: adminDeleteMember
      tags: [admin]
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean

  /admin/posts:
    get:
      operationId: adminListPosts
      tags: [admin]
      summary: List all posts for admin
      parameters:
        - name: communityId
          in: query
          required: false
          schema:
            type: string
            default: "default"
      responses:
        "200":
          description: List of posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Post"

  /admin/posts/{postId}:
    delete:
      operationId: adminDeletePost
      tags: [admin]
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean

  /admin/posts/{postId}/pin:
    patch:
      operationId: adminTogglePin
      tags: [admin]
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"

  /admin/community:
    get:
      operationId: adminGetCommunity
      tags: [admin]
      parameters:
        - name: communityId
          in: query
          required: false
          schema:
            type: string
            default: "default"
      responses:
        "200":
          description: Community settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunitySettings"
    put:
      operationId: adminUpdateCommunity
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunitySettingsInput"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunitySettings"

  /admin/stats:
    get:
      operationId: adminGetStats
      tags: [admin]
      parameters:
        - name: communityId
          in: query
          required: false
          schema:
            type: string
            default: "default"
      responses:
        "200":
          description: Community stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  /admin/announcements:
    post:
      operationId: adminCreateAnnouncement
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnouncementInput"
      responses:
        "201":
          description: Created announcement post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"

  /safety:
    get:
      operationId: listAlerts
      tags: [safety]
      summary: List community safety alerts
      parameters:
        - name: communityId
          in: query
          required: false
          schema:
            type: string
            default: "default"
        - name: resolved
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: List of alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alert"
    post:
      operationId: createAlert
      tags: [safety]
      summary: Report a safety alert
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertInput"
      responses:
        "201":
          description: Created alert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"

  /safety/{alertId}/resolve:
    patch:
      operationId: resolveAlert
      tags: [safety]
      summary: Mark alert as resolved
      parameters:
        - name: alertId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated alert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"

  /safety/{alertId}/comments:
    get:
      operationId: listAlertComments
      tags: [safety]
      summary: Get comments for an alert
      parameters:
        - name: alertId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AlertComment"
    post:
      operationId: createAlertComment
      tags: [safety]
      summary: Add a comment to an alert
      parameters:
        - name: alertId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertCommentInput"
      responses:
        "201":
          description: Created comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertComment"

  /marketplace:
    get:
      operationId: listListings
      tags: [marketplace]
      summary: List marketplace listings
      parameters:
        - name: communityId
          in: query
          required: false
          schema:
            type: string
            default: "default"
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: minPrice
          in: query
          required: false
          schema:
            type: integer
        - name: maxPrice
          in: query
          required: false
          schema:
            type: integer
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 24
      responses:
        "200":
          description: List of listings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingList"
    post:
      operationId: createListing
      tags: [marketplace]
      summary: Create a marketplace listing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListingInput"
      responses:
        "201":
          description: Created listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"

  /marketplace/{listingId}:
    get:
      operationId: getListing
      tags: [marketplace]
      summary: Get a single listing
      parameters:
        - name: listingId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Listing detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        "404":
          description: Not found

  /marketplace/{listingId}/status:
    patch:
      operationId: updateListingStatus
      tags: [marketplace]
      summary: Update listing status (sold / reserved / available)
      parameters:
        - name: listingId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListingStatusUpdate"
      responses:
        "200":
          description: Updated listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      description: |
        Returns a presigned GCS URL for direct upload. The client sends JSON
        metadata here, then uploads the file directly to the returned URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: File not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to serve public object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to serve object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'


  /events:
    get:
      operationId: listEvents
      tags: [events]
      parameters:
        - name: communityId
          in: query
          required: false
          schema: { type: string, default: "default" }
      responses:
        "200":
          description: Upcoming and past events
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventList" }
    post:
      operationId: createEvent
      tags: [events]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventInput" }
      responses:
        "201":
          description: Created event
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }

  /events/{eventId}/rsvp:
    post:
      operationId: rsvpEvent
      tags: [events]
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RsvpInput" }
      responses:
        "200":
          description: RSVP recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Rsvp" }

  /events/{eventId}/rsvps:
    get:
      operationId: listEventRsvps
      tags: [events]
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: RSVPs for event
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Rsvp" }

  /polls:
    get:
      operationId: listPolls
      tags: [polls]
      parameters:
        - name: communityId
          in: query
          required: false
          schema: { type: string, default: "default" }
        - name: userId
          in: query
          required: false
          schema: { type: string, default: "ahmed" }
      responses:
        "200":
          description: Active and ended polls
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PollList" }
    post:
      operationId: createPoll
      tags: [polls]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PollInput" }
      responses:
        "201":
          description: Created poll
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PollResult" }

  /polls/{pollId}/vote:
    post:
      operationId: votePoll
      tags: [polls]
      parameters:
        - name: pollId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PollVoteInput" }
      responses:
        "200":
          description: Updated poll results
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PollResult" }

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Post:
      type: object
      required:
        - id
        - communityId
        - userId
        - userName
        - unitNumber
        - type
        - title
        - body
        - imageUrls
        - isPinned
        - likesCount
        - commentsCount
        - createdAt
      properties:
        id:
          type: integer
        communityId:
          type: string
        userId:
          type: string
        userName:
          type: string
        unitNumber:
          type: string
        type:
          type: string
        title:
          type: string
        body:
          type: string
        imageUrls:
          type: array
          items:
            type: string
        isPinned:
          type: boolean
        likesCount:
          type: integer
        commentsCount:
          type: integer
        createdAt:
          type: string

    PostList:
      type: object
      required:
        - posts
        - total
        - page
        - limit
        - hasMore
      properties:
        posts:
          type: array
          items:
            $ref: "#/components/schemas/Post"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        hasMore:
          type: boolean

    PostInput:
      type: object
      required:
        - title
        - body
        - type
      properties:
        communityId:
          type: string
          default: "default"
        userId:
          type: string
          default: "ahmed"
        userName:
          type: string
          default: "Ahmed Khan"
        unitNumber:
          type: string
          default: "B-204"
        type:
          type: string
        title:
          type: string
        body:
          type: string
        imageUrls:
          type: array
          items:
            type: string
        isPinned:
          type: boolean
          default: false

    Comment:
      type: object
      required:
        - id
        - postId
        - userId
        - userName
        - unitNumber
        - body
        - createdAt
      properties:
        id:
          type: integer
        postId:
          type: integer
        userId:
          type: string
        userName:
          type: string
        unitNumber:
          type: string
        body:
          type: string
        createdAt:
          type: string

    CommentInput:
      type: object
      required:
        - body
      properties:
        userId:
          type: string
          default: "ahmed"
        userName:
          type: string
          default: "Ahmed Khan"
        unitNumber:
          type: string
          default: "B-204"
        body:
          type: string

    Alert:
      type: object
      required:
        - id
        - communityId
        - userId
        - userName
        - unitNumber
        - type
        - title
        - description
        - locationDetail
        - severity
        - isResolved
        - createdAt
      properties:
        id:
          type: integer
        communityId:
          type: string
        userId:
          type: string
        userName:
          type: string
        unitNumber:
          type: string
        type:
          type: string
        title:
          type: string
        description:
          type: string
        locationDetail:
          type: string
        imageUrl:
          type: string
          nullable: true
        severity:
          type: string
        isResolved:
          type: boolean
        createdAt:
          type: string

    AlertInput:
      type: object
      required:
        - type
        - title
        - description
      properties:
        communityId:
          type: string
          default: "default"
        userId:
          type: string
          default: "ahmed"
        userName:
          type: string
          default: "Ahmed Khan"
        unitNumber:
          type: string
          default: "B-204"
        type:
          type: string
        title:
          type: string
        description:
          type: string
        locationDetail:
          type: string
          default: ""
        imageUrl:
          type: string
          nullable: true
        severity:
          type: string
          default: "medium"

    AlertComment:
      type: object
      required:
        - id
        - alertId
        - userId
        - userName
        - unitNumber
        - body
        - createdAt
      properties:
        id:
          type: integer
        alertId:
          type: integer
        userId:
          type: string
        userName:
          type: string
        unitNumber:
          type: string
        body:
          type: string
        createdAt:
          type: string

    AlertCommentInput:
      type: object
      required:
        - body
      properties:
        userId:
          type: string
          default: "ahmed"
        userName:
          type: string
          default: "Ahmed Khan"
        unitNumber:
          type: string
          default: "B-204"
        body:
          type: string

    Listing:
      type: object
      required:
        - id
        - communityId
        - userId
        - userName
        - unitNumber
        - title
        - description
        - category
        - imageUrls
        - condition
        - status
        - whatsappNumber
        - createdAt
      properties:
        id:
          type: integer
        communityId:
          type: string
        userId:
          type: string
        userName:
          type: string
        unitNumber:
          type: string
        title:
          type: string
        description:
          type: string
        pricePkr:
          type: integer
          nullable: true
        category:
          type: string
        imageUrls:
          type: array
          items:
            type: string
        condition:
          type: string
        status:
          type: string
        whatsappNumber:
          type: string
        createdAt:
          type: string

    ListingList:
      type: object
      required:
        - listings
        - total
        - page
        - limit
        - hasMore
      properties:
        listings:
          type: array
          items:
            $ref: "#/components/schemas/Listing"
        total:
          type: integer
