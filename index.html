<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />

    <!-- Primary SEO -->
    <title>Mohalla – Community Hub</title>
    <meta name="description" content="Mohalla is your neighbourhood's digital hub — community feed, buy & sell marketplace, safety alerts, events, and polls all in one place." />
    <meta name="keywords" content="mohalla, community, neighbourhood, pakistan, buy sell, safety alerts, events" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Mohalla Community Hub" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mohalla" />
    <meta property="og:title" content="Mohalla – Community Hub" />
    <meta property="og:description" content="Stay connected with your neighbours. Post updates, trade goods, report safety alerts, and attend events — all in your Mohalla." />
    <meta property="og:image" content="/pwa-512.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mohalla – Community Hub" />
    <meta name="twitter:description" content="Your neighbourhood's digital hub." />
    <meta name="twitter:image" content="/pwa-512.png" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="application-name" content="Mohalla" />
    <meta name="theme-color" content="#0b4f49" />
    <meta name="msapplication-TileColor" content="#0b4f49" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Mohalla" />

    <!-- Icons -->
    <link rel="icon" type="image/png" href="/brand/mohalla-brand-mark.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&display=swap" rel="stylesheet">
    <script>
      (function () {
        try {
          var storedTheme = window.localStorage.getItem("mohalla-theme");
          var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (storedTheme ? storedTheme === "dark" : prefersDark) {
            document.documentElement.classList.add("dark");
          }
        } catch (error) {
          document.documentElement.classList.remove("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
