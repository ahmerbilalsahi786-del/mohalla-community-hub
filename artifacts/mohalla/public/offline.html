<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mohalla – No Connection</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f8fafc;
      color: #1e293b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100svh;
      padding: 2rem;
      text-align: center;
    }
    .icon {
      width: 72px; height: 72px;
      background: #f0fdf4;
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1.5rem;
      font-size: 2.5rem;
    }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
    p { font-size: 0.9rem; color: #64748b; max-width: 300px; line-height: 1.6; }
    button {
      margin-top: 1.5rem;
      padding: 0.65rem 1.75rem;
      background: #16a34a;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #15803d; }
  </style>
</head>
<body>
  <div class="icon">📶</div>
  <h1>You're offline</h1>
  <p>Mohalla needs an internet connection to load your community data. Please check your connection and try again.</p>
  <button onclick="window.location.reload()">Try again</button>
</body>
</html>
