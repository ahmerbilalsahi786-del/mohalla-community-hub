kind = "web"
previewPath = "/"
title = "Mohalla - Community Hub"
version = "1.0.0"
id = "artifacts/mohalla"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23024

[services.development]
run = "pnpm --filter @workspace/mohalla run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mohalla", "run", "build" ]
publicDir = "artifacts/mohalla/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23024"
BASE_PATH = "/"
